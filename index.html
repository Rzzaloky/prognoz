<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROGNOZ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0d10;
            color: #fff;
        }

        header {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid #242830;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .date {
            margin-top: 8px;
            color: #8f96a3;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .league {
            margin-bottom: 30px;
        }

        .league-title {
            font-size: 20px;
            font-weight: bold;
            padding: 14px;
            background: #171a20;
            border-radius: 10px 10px 0 0;
        }

        .match {
            background: #111419;
            border: 1px solid #242830;
            padding: 18px;
            margin-bottom: 8px;
            border-radius: 10px;
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .team {
            font-size: 17px;
            font-weight: bold;
            width: 40%;
        }

        .away {
            text-align: right;
        }

        .time {
            color: #8f96a3;
            white-space: nowrap;
        }

        .odds {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .odd {
            background: #1b1f26;
            padding: 9px 12px;
            border-radius: 7px;
            font-size: 13px;
        }

        .odd span {
            color: #8f96a3;
            margin-right: 5px;
        }

        .loading,
        .error,
        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #8f96a3;
        }

        @media (max-width: 600px) {
            .teams {
                flex-direction: column;
                align-items: stretch;
            }

            .team,
            .away {
                width: 100%;
                text-align: center;
            }

            .time {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>PROGNOZ</h1>
    <div class="date" id="date">Yüklənir...</div>
</header>

<div class="container" id="matches">
    <div class="loading">Oyunlar yüklənir...</div>
</div>

<script>

async function loadMatches() {

    const container = document.getElementById("matches");

    try {

        const response = await fetch("./data.json");

        if (!response.ok) {
            throw new Error("data.json tapılmadı");
        }

        const data = await response.json();

        document.getElementById("date").textContent =
            data.date + " • " + data.match_count + " oyun";

        if (!data.matches || data.matches.length === 0) {

            container.innerHTML =
                '<div class="empty">Bu tarix üçün oyun yoxdur.</div>';

            return;
        }

        const leagues = {};

        data.matches.forEach(match => {

            if (!leagues[match.league]) {
                leagues[match.league] = [];
            }

            leagues[match.league].push(match);

        });

        container.innerHTML = "";

        Object.keys(leagues).forEach(leagueName => {

            const leagueDiv = document.createElement("div");

            leagueDiv.className = "league";

            leagueDiv.innerHTML = `
                <div class="league-title">
                    ${leagueName}
                </div>
            `;

            leagues[leagueName].forEach(match => {

                const matchDiv = document.createElement("div");

                matchDiv.className = "match";

                const date = new Date(match.kickoff);

                const time = date.toLocaleTimeString(
                    "az-AZ",
                    {
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

                let oddsHTML = "";

                if (match.odds && match.odds.length > 0) {

                    const latest = {};

                    match.odds.forEach(odd => {

                        const key =
                            odd.market + "|" + odd.selection;

                        latest[key] = odd;

                    });

                    Object.values(latest).forEach(odd => {

                        oddsHTML += `
                            <div class="odd">
                                <span>${odd.selection}</span>
                                <b>${Number(odd.odds).toFixed(2)}</b>
                            </div>
                        `;

                    });

                }

                matchDiv.innerHTML = `
                    <div class="teams">

                        <div class="team">
                            ${match.home_team}
                        </div>

                        <div class="time">
                            ${time}
                        </div>

                        <div class="team away">
                            ${match.away_team}
                        </div>

                    </div>

                    <div class="odds">
                        ${oddsHTML}
                    </div>
                `;

                leagueDiv.appendChild(matchDiv);

            });

            container.appendChild(leagueDiv);

        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                Oyunlar yüklənmədi.<br><br>
                ${error.message}
            </div>
        `;
    }
}

loadMatches();

</script>

</body>
</html>
