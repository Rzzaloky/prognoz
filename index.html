<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROGNOZ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0d10;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    padding: 25px;
    text-align: center;
    border-bottom: 1px solid #252932;
}

.logo {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 2px;
}

.subtitle {
    margin-top: 8px;
    color: #8d94a0;
}

.container {
    max-width: 1000px;
    margin: 25px auto;
    padding: 0 15px;
}

.league {
    margin-bottom: 30px;
}

.league-title {
    background: #171a20;
    border: 1px solid #252932;
    padding: 14px 16px;
    border-radius: 10px 10px 0 0;
    font-size: 18px;
    font-weight: bold;
}

.match {
    background: #111419;
    border: 1px solid #252932;
    border-top: none;
    padding: 18px;
}

.match:last-child {
    border-radius: 0 0 10px 10px;
}

.match-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.team {
    width: 40%;
    font-size: 17px;
    font-weight: bold;
}

.away {
    text-align: right;
}

.time {
    color: #9299a5;
    white-space: nowrap;
}

.markets {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
}

.market {
    background: #191d24;
    border-radius: 8px;
    padding: 12px;
}

.market-name {
    color: #aeb4bf;
    font-size: 13px;
    margin-bottom: 10px;
    font-weight: bold;
}

.selections {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.selection {
    background: #242932;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
}

.selection-name {
    color: #c3c8d0;
    margin-right: 5px;
}

.selection-odd {
    font-weight: bold;
}

.loading,
.error,
.empty {
    text-align: center;
    padding: 60px 20px;
    color: #8d94a0;
}
</style>
</head>

<body>

<header>
    <div class="logo">PROGNOZ</div>
    <div class="subtitle" id="date">Oyunlar yüklənir...</div>
</header>

<div class="container" id="matches">
    <div class="loading">Oyunlar yüklənir...</div>
</div>

<script>

async function loadMatches() {

    const container = document.getElementById("matches");

    try {

        const response = await fetch("./data.json");

        if (!response.ok) {
            throw new Error("data.json yüklənmədi");
        }

        const data = await response.json();
        const matches = data.matches || [];

        document.getElementById("date").textContent =
            matches.length + " oyun";

        if (matches.length === 0) {
            container.innerHTML =
                '<div class="empty">Bu tarix üçün oyun yoxdur.</div>';
            return;
        }

        /*
         * Oyunları liqalara bölürük
         */

        const leagues = {};

        matches.forEach(match => {

            const league = match.league || "Digər";

            if (!leagues[league]) {
                leagues[league] = [];
            }

            leagues[league].push(match);

        });

        container.innerHTML = "";

        /*
         * Liqaları göstəririk
         */

        Object.entries(leagues).forEach(
            ([leagueName, leagueMatches]) => {

                const leagueDiv =
                    document.createElement("div");

                leagueDiv.className = "league";

                leagueDiv.innerHTML = `
                    <div class="league-title">
                        ${leagueName}
                    </div>
                `;

                /*
                 * Oyunları göstəririk
                 */

                leagueMatches.forEach(match => {

                    const matchDiv =
                        document.createElement("div");

                    matchDiv.className = "match";

                    let time = "";

                    if (match.kickoff) {

                        const date =
                            new Date(match.kickoff);

                        time =
                            date.toLocaleTimeString(
                                "az-AZ",
                                {
                                    hour: "2-digit",
                                    minute: "2-digit"
                                }
                            );
                    }

                    /*
                     * Marketləri qruplaşdırırıq
                     */

                    const markets = {};

                    (match.odds || []).forEach(odd => {

                        const market =
                            odd.market || "Digər";

                        if (!markets[market]) {
                            markets[market] = {};
                        }

                        /*
                         * Eyni selection üçün
                         * yalnız ən son snapshot qalır.
                         */

                        const selection =
                            odd.selection || "";

                        const old =
                            markets[market][selection];

                        if (
                            !old ||
                            String(odd.timestamp || "") >
                            String(old.timestamp || "")
                        ) {
                            markets[market][selection] = odd;
                        }

                    });

                    let marketsHTML = "";

                    /*
                     * Marketləri HTML-ə çeviririk
                     */

                    Object.entries(markets).forEach(
                        ([marketName, selections]) => {

                            marketsHTML += `
                                <div class="market">

                                    <div class="market-name">
                                        ${marketName}
                                    </div>

                                    <div class="selections">
                            `;

                            Object.values(selections).forEach(
                                odd => {

                                    marketsHTML += `
                                        <div class="selection">

                                            <span class="selection-name">
                                                ${odd.selection}
                                            </span>

                                            <span class="selection-odd">
                                                ${Number(odd.odds).toFixed(2)}
                                            </span>

                                        </div>
                                    `;

                                }
                            );

                            marketsHTML += `
                                    </div>
                                </div>
                            `;

                        }
                    );

                    /*
                     * Oyunun özü
                     */

                    matchDiv.innerHTML = `

                        <div class="match-info">

                            <div class="team">
                                ${match.home_team}
                            </div>

                            <div class="time">
                                ${time}
                            </div>

                            <div class="team away">
                                ${match.away_team}
                            </div>

                        </div>

                        <div class="markets">
                            ${marketsHTML}
                        </div>

                    `;

                    leagueDiv.appendChild(matchDiv);

                });

                container.appendChild(leagueDiv);

            }
        );

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                Oyunlar yüklənmədi.
                <br><br>
                ${error.message}
            </div>
        `;
    }
}

loadMatches();

</script>

</body>
</html>
